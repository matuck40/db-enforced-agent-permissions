# Throwaway Postgres for the test suite. Trust auth and a loopback-only port:
# this database holds nothing but fixtures and is destroyed after every run.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      # TCP, not the socket: the image's init server only listens on the
      # socket, so this passes once the real server is up.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "app"]
      interval: 1s
      timeout: 3s
      retries: 30
